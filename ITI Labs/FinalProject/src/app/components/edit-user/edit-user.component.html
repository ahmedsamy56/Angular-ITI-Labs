<!-- Edit User Modal -->
<div class="modal fade show" [class.d-block]="showModal" tabindex="-1" role="dialog" *ngIf="showModal">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit User</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="editUserForm" (ngSubmit)="updateUser()">
          <div class="mb-3">
            <label for="edit-name" class="form-label">Name</label>
            <input 
              type="text" 
              class="form-control" 
              id="edit-name"
              formControlName="name"
              [class.is-invalid]="name?.invalid && name?.touched"
              placeholder="Enter name"
            >
            <div class="invalid-feedback" *ngIf="name?.invalid && name?.touched">
              <div *ngIf="name?.errors?.['required']">Name is required</div>
              <div *ngIf="name?.errors?.['minlength']">Name must be at least 2 characters</div>
              <div *ngIf="name?.errors?.['maxlength']">Name cannot exceed 50 characters</div>
            </div>
          </div>
          <div class="mb-3">
            <label for="edit-email" class="form-label">Email</label>
            <input 
              type="email" 
              class="form-control" 
              id="edit-email"
              formControlName="email"
              [class.is-invalid]="email?.invalid && email?.touched"
              placeholder="Enter email address"
            >
            <div class="invalid-feedback" *ngIf="email?.invalid && email?.touched">
              <div *ngIf="email?.errors?.['required']">Email is required</div>
              <div *ngIf="email?.errors?.['email']">Please enter a valid email address</div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="updateUser()" [disabled]="editUserForm.invalid">
          Update User
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Backdrop -->
<div class="modal-backdrop fade show" *ngIf="showModal"></div>
