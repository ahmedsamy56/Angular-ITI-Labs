<div class="container-fluid p-0">
  <!-- Header Component -->
  <app-header></app-header>

  <!-- Main Content -->
  <div class="container mt-4">
    <!-- Search and Add User Row -->
    <div class="row mb-4">
      <div class="col-md-6">
        <app-search (searchChange)="onSearchChange($event)"></app-search>
      </div>
      <div class="col-md-6 text-end">
        <app-add-user (userAdded)="onUserAdded($event)"></app-add-user>
      </div>
    </div>

    <!-- Users Table -->
    <div class="card">
      <div class="card-body p-0">
        <table class="table table-striped mb-0">
          <thead class="table-primary">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of filteredUsers">
              <td>{{ user.id }}</td>
              <td>{{ user.name }}</td>
              <td>{{ user.email }}</td>
              <td>
                <button class="btn btn-warning btn-sm me-2" (click)="onEditUser(user)">
                  <i class="fas fa-edit me-1"></i>
                  Edit
                </button>
                <button class="btn btn-danger btn-sm" (click)="onDeleteUser(user)">
                  <i class="fas fa-trash me-1"></i>
                  Delete
                </button>
              </td>
            </tr>
            <tr *ngIf="filteredUsers.length === 0">
              <td colspan="4" class="text-center py-4">
                <i class="fas fa-info-circle text-muted me-2"></i>
                No users found
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Edit User Component -->
<app-edit-user 
  [user]="userToEdit"
  (userUpdated)="onUserUpdated($event)"
  (modalClosed)="onEditModalClosed()">
</app-edit-user>

<!-- Delete Confirmation Modal -->
<div class="modal fade show" [class.d-block]="showDeleteModal" tabindex="-1" role="dialog" *ngIf="showDeleteModal">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirm Delete</h5>
        <button type="button" class="btn-close" (click)="closeDeleteModal()"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete user <strong>{{ userToDelete?.name }}</strong>?</p>
        <p class="text-muted">This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeDeleteModal()">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Backdrop for Delete Modal -->
<div class="modal-backdrop fade show" *ngIf="showDeleteModal"></div>
