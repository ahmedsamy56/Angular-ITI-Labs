<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task 2</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="container">
    <h2>Validation Game</h2>
    <form id="validationForm">
      <label for="name">Name</label>
      <input type="text" id="name" />
      <span class="error" id="nameError">name length must be > 4 letters</span>

      <label for="pass">Pass</label>
      <input type="password" id="pass" />
      <span class="error" id="passError">pass length must be > 8 letters</span>

      <label for="email">Email</label>
      <input type="text" id="email" />
      <span class="error" id="emailError">mail not valid</span>

      <label>Gender</label>
      <input type="radio" name="gender" value="male" /> Male
      <input type="radio" name="gender" value="female" /> Female
      <span class="error" id="genderError">choose your gender</span>

      <label>Sport</label>
      <input type="checkbox" name="sport" value="tennis" /> Tennis
      <input type="checkbox" name="sport" value="football" /> Football
      <input type="checkbox" name="sport" value="volleyball" /> Volleyball
      <span class="error" id="sportError">choose your sport</span>

      <label for="country">Country</label>
      <select id="country">
        <option>Egyptian</option>
        <option>American</option>
        <option>British</option>
      </select>

      <div class="buttons">
        <button type="submit" class="submit">Submit</button>
        <button type="reset" class="reset">Reset</button>
      </div>
    </form>
  </div>

  <script src="main.js"></script>
</body>
</html>
