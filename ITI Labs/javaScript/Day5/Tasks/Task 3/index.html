<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Image Slider</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <div class="slider-container">
    <div class="slider" style="display: block;"><img src="imgs/2019-bmw-m2-competition_20.jpg"></div>
    <div class="slider"><img src="imgs/2019_BMW_Z4_M40i_Front.jpg"></div>
    <div class="slider"><img src="imgs/wallpaperflare.com_wallpaper.jpg"></div>
  </div>

  <div class="controls">
    <button onclick="prevSlide()">Left</button>
    <button onclick="looping()">Play</button>
    <button onclick="stopLooping()">Stop</button>
    <button onclick="nextSlide()">Right</button>
  </div>


  <script src="./main.js"></script>
</body>
</html>
