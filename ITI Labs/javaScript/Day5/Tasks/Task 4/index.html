<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Task 4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <form onsubmit="return cookieServ()">
        <label>Enter your name:</label><br>
        <input type="text" id="name"><br><br>

        <label>Enter your age:</label><br>
        <input type="number" id="age"><br><br>

        <label>Select your Gender:</label><br>
        <div class="gender-options">
            <label>
                <input type="radio" name="gender" value="male"> 
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxz7qJ9pU6Xj2EJKaRDVz-9Bd0xh2LnMklGw&s" alt="Male" class="gender-img"><br>Male
            </label>
            <label>
                <input type="radio" name="gender" value="female"> 
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzPRQ6LprnPzvvP-_vVO_nhSokwda8CMsnwQ&s" alt="Female" class="gender-img"><br>Female
            </label>
        </div><br>

        <label>Select your favorite color:</label><br>
        <select id="color">
        <option>Red</option>
        <option>Blue</option>
        <option>Green</option>
        </select><br><br>

        <button type="submit">Register</button>
    </form>
  <script src="main.js"></script>
</body>
</html>
