<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <h1>Fetch Users</h1>
        <div class="controls" style="justify-content: space-between; align-items: center;">
            <button id="btn">Load Users</button>
            <div style="display: flex; align-items: center;">
                <input type="text" id="search" placeholder="ID" style="margin-right: 8px; padding: 8px;">
                <button id="searchBtn">Search</button>
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>id</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>City</th>
                    <th>Website</th>
                    <th>Action</th>
                </tr>
            </thead>
                <tbody id="tbody">

                </tbody>
            </table>
    </div>



    <script src="main.js"></script>
</body>
</html>
