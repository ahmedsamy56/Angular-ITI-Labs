<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="profile-card">
        <img id="profileImg" src="" alt="Profile Image">
        <h2 id="name"></h2>
        <div class="profile-info">
            <div><span class="profile-label">Username:</span> <span class="profile-value" id="username"></span></div>
            <div><span class="profile-label">Phone:</span> <span class="profile-value" id="phone"></span></div>
            <div><span class="profile-label">Email:</span> <span class="profile-value" id="email"></span></div>
            <div><span class="profile-label">City:</span> <span class="profile-value" id="city"></span></div>
            <div><span class="profile-label">Website:</span> <span class="profile-value" id="website"></span></div>
        </div>
    </div>
    <script src="profile.js"></script>
</body>
</html>
